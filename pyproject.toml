[project]
name = "terminal-session-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Alejandro", email = "danieldoalto@yahoo.com.br" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.3",
    "paramiko>=3.5.0",
    "pyyaml>=6.0.2",
    "scp>=0.15.0",
]

[project.scripts]
terminal-session-manager = "terminal_session_manager.main:main"
terminal-session-manager-mcp = "terminal_session_manager.mcp.server:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
